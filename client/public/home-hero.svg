<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">OPUS workspace overlooking Himalayan hills</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C5D8E4"/>
      <stop offset="55%" stop-color="#E7EEF2"/>
      <stop offset="100%" stop-color="#F2F5F7"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D5A5B"/>
      <stop offset="100%" stop-color="#1F3436"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8AA5B0"/>
      <stop offset="100%" stop-color="#6B8794"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="960" height="720" fill="url(#sky)"/>
  <ellipse cx="720" cy="120" rx="160" ry="70" fill="#F7FBFD" opacity="0.7" filter="url(#soft)"/>

  <path d="M0 420 C120 360 220 380 320 400 C420 420 500 340 600 360 C700 380 780 320 960 350 L960 720 L0 720 Z" fill="url(#ridgeFar)" opacity="0.55"/>
  <path d="M0 500 C140 440 260 470 380 490 C520 515 620 430 740 460 C830 480 900 450 960 470 L960 720 L0 720 Z" fill="url(#ridge)"/>

  <path d="M80 560 H880 L920 720 H40 Z" fill="#D8DEE3"/>
  <path d="M80 560 H880 L860 548 H100 Z" fill="#EEF2F5"/>

  <g transform="translate(170 150)">
    <rect width="520" height="360" rx="16" fill="#FBFCFD" stroke="#B8C4CC" stroke-width="1"/>
    <rect width="520" height="40" rx="16" fill="#E8EEF2"/>
    <rect y="24" width="520" height="16" fill="#E8EEF2"/>
    <circle cx="22" cy="20" r="5" fill="#E26D6D"/>
    <circle cx="40" cy="20" r="5" fill="#E0B35A"/>
    <circle cx="58" cy="20" r="5" fill="#6DBF8A"/>
    <text x="260" y="25" text-anchor="middle" fill="#4A5A64" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="600">OPUS - Active brief</text>

    <text x="36" y="84" fill="#1C252B" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="22" font-weight="700">Brand kit for a Kathmandu cafe</text>
    <text x="36" y="112" fill="#5B6B75" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Design · NPR 12,000 · Due Friday</text>

    <rect x="36" y="140" width="448" height="10" rx="5" fill="#E4EBF0"/>
    <rect x="36" y="140" width="280" height="10" rx="5" fill="#0071e3"/>
    <text x="36" y="172" fill="#5B6B75" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">Progress · Review QR unlocks on delivery</text>

    <g transform="translate(36 210)">
      <rect width="200" height="110" rx="10" fill="#F0F7FF" stroke="#C5D4E8"/>
      <text x="16" y="32" fill="#0071e3" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700">TASK CERTIFICATE</text>
      <text x="16" y="56" fill="#1C252B" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="600">UI polish complete</text>
      <text x="16" y="78" fill="#5B6B75" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Verified · e-statement ready</text>
      <circle cx="168" cy="58" r="22" fill="#0071e3" opacity="0.12"/>
      <circle cx="168" cy="58" r="14" stroke="#0071e3" stroke-width="2" fill="none"/>
      <path d="M162 58 L166 62 L176 52" stroke="#0071e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(260 210)">
      <rect width="224" height="110" rx="10" fill="#FFFFFF" stroke="#D0D9DF"/>
      <text x="16" y="32" fill="#1C252B" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700">Local payment</text>
      <rect x="16" y="48" width="64" height="64" rx="6" fill="#1C252B"/>
      <path d="M28 60 h40 v40 h-40 z" stroke="#F2F5F7" stroke-width="2"/>
      <path d="M36 72 h8v8h-8z M52 72 h8v8h-8z M36 88 h8v8h-8z M44 80 h8v8h-8z" fill="#F2F5F7"/>
      <text x="96" y="72" fill="#5B6B75" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Unique QR on</text>
      <text x="96" y="90" fill="#5B6B75" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">task completion</text>
    </g>
  </g>
</svg>
